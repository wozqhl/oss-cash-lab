name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-and-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Skip install/cache: stdlib-only smoke (no lockfile).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke
        run: make smoke

      - name: Local MVP
        run: make local-mvp

      # Optional short stack demo (B+C+D+E+F HTTP without Docker)
      - name: Stack demo (optional)
        run: make stack-demo
        continue-on-error: true

