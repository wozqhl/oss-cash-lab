name: agent-ci
description: Wrap Promptfoo or DeepEval-shaped JSON (or a fixture) and emit JUnit/TAP/Markdown (job summary) via agent-ci reporters
inputs:
  results:
    description: Path to Promptfoo eval --output JSON, DeepEval-shaped JSON (adapter=deepeval), or a checked-in fixture
    required: false
    default: promptfoo-output.json
  adapter:
    description: JSON shape (promptfoo or deepeval). Default promptfoo so existing workflows stay put.
    required: false
    default: promptfoo
  command:
    description: Optional command that writes the JSON at `results` (e.g. npx promptfoo eval --output …). Empty = convert an existing file / fixture (no network).
    required: false
    default: ""
  fail-under:
    description: Quality gate 0–100 (pass-rate score). Empty = fail only if any case failed.
    required: false
    default: ""
  junit:
    description: JUnit XML output path
    required: false
    default: junit.xml
  tap:
    description: Optional TAP13 output path (empty = skip)
    required: false
    default: ""
  md:
    description: Markdown report path (GFM pass/fail table). Also appended to $GITHUB_STEP_SUMMARY when that env is set (GitHub Actions job summary; no live keys).
    required: false
    default: report.md
  suite-name:
    description: testsuite / TAP / Markdown label (default promptfoo; set deepeval when adapter=deepeval)
    required: false
    default: promptfoo
  pythonpath:
    description: Extra PYTHONPATH entries (action src is always prepended)
    required: false
    default: ""
outputs:
  junit-path:
    description: Path to the JUnit XML file
    value: ${{ inputs.junit }}
  md-path:
    description: Path to the Markdown report (job summary table)
    value: ${{ inputs.md }}
runs:
  using: composite
  steps:
    - name: Convert eval results
      shell: bash
      env:
        INPUT_RESULTS: ${{ inputs.results }}
        INPUT_ADAPTER: ${{ inputs.adapter }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_TAP: ${{ inputs.tap }}
        INPUT_MD: ${{ inputs.md }}
        INPUT_SUITE_NAME: ${{ inputs.suite-name }}
        INPUT_PYTHONPATH: ${{ inputs.pythonpath }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        export PYTHONPATH="${ACTION_PATH}/src${INPUT_PYTHONPATH:+:${INPUT_PYTHONPATH}}"
        if [[ -n "${INPUT_COMMAND}" ]]; then
          echo "Running producer: ${INPUT_COMMAND}"
          bash -lc "${INPUT_COMMAND}"
        fi
        if [[ -z "${INPUT_RESULTS}" ]]; then
          echo "::error::results path is required (Promptfoo / DeepEval-shaped JSON or a fixture)"
          exit 2
        fi
        adapter="${INPUT_ADAPTER:-promptfoo}"
        if [[ "${adapter}" == "deepeval" ]]; then
          cmd=from-deepeval
          default_suite=deepeval
        else
          cmd=from-promptfoo
          default_suite=promptfoo
        fi
        suite="${INPUT_SUITE_NAME:-${default_suite}}"
        if [[ "${adapter}" == "deepeval" && "${suite}" == "promptfoo" ]]; then
          suite="${default_suite}"
        fi
        args=("${cmd}" --in "${INPUT_RESULTS}" --suite-name "${suite}")
        if [[ -n "${INPUT_JUNIT}" ]]; then
          args+=(--junit "${INPUT_JUNIT}")
        fi
        if [[ -n "${INPUT_TAP}" ]]; then
          args+=(--tap "${INPUT_TAP}")
        fi
        if [[ -n "${INPUT_MD}" ]]; then
          args+=(--md "${INPUT_MD}")
        fi
        if [[ -n "${INPUT_FAIL_UNDER}" ]]; then
          args+=(--fail-under "${INPUT_FAIL_UNDER}")
        fi
        python3 -m agent_ci "${args[@]}"
