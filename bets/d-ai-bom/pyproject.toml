[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bom"
version = "0.1.0"
description = "AI-BOM scanner for models, prompts, and MCP deps"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "wozqhl" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
ai-bom = "ai_bom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
