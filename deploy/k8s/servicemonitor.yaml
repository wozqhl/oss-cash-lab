# Prometheus Operator ServiceMonitors for B–F GET /metrics.
# Requires CRDs: monitoring.coreos.com/v1 (prometheus-operator).
# Not applied in make smoke (parse-only YAML). Apply separately so
# `kubectl apply -k deploy/k8s` still works without the CRDs:
#   kubectl apply -f deploy/k8s/servicemonitor.yaml
# Selector labels match each Service metadata.labels (not a common label).
# Endpoint port name `http` matches Service spec.ports[].name.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: b-mcp-gateway
  labels:
    app.oss-cash-lab.dev/b-mcp-gateway: "true"
spec:
  selector:
    matchLabels:
      app.oss-cash-lab.dev/b-mcp-gateway: "true"
  namespaceSelector:
    any: true
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
